name: ITOM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline application tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic tests without live credentials or source access
        env:
          SCHEDULER_ENABLED: "false"
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: >-
          python -m pytest
          tests/test_graph_client_contract.py
          tests/test_intune_forecast.py
          tests/test_source_proxy_routing.py
          tests/test_summary_cache.py
          tests/test_ui_truthfulness.py
          tests/test_local_service_environment.py
          tests/test_sqlite_runtime_pragmas.py
          tests/test_frontend_home_contract.py
          -q
